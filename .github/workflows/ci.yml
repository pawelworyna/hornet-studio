name: Build & Test

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '11.0.x'
        include-prerelease: true

    - name: Restore Dependencies
      run: dotnet restore HornetStudio.slnx

    - name: Build Solution
      run: dotnet build HornetStudio.slnx --configuration Release --no-restore

    - name: Run Unit Tests
      run: dotnet test HornetStudio.slnx --configuration Release --no-build --verbosity normal
